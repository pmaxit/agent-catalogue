# Writing Agent Pipeline — all agent definitions, models, goals, and graph
# flow are configured here. Secrets are referenced by env var name only.

api:
  base_url: ${CURSOR_API_BASE_URL:-https://api.cursor.com}
  # Resolved from process env at runtime. Never put real keys in this file.
  key_env: CURSOR_API_KEY
  # basic = HTTP Basic with api_key as username (Cursor default)
  # bearer = Authorization: Bearer <key>
  auth: basic
  # When true (or CURSOR_API_KEY missing), orchestrator uses a local mock runner
  mock: ${CURSOR_MOCK:-false}
  poll_interval_ms: 2000
  request_timeout_ms: 120000
  run_timeout_ms: 600000

defaults:
  model:
    id: ${CURSOR_MODEL:-composer-2.5}
  # no_repo cloud agents (omit repos/env) — ideal for pure writing work
  runtime: no_repo
  # shared = one Cursor agent reused across steps (follow-up runs)
  # per_step = fresh Cursor agent per graph node
  session: per_step
  mode: agent

app:
  title: Quill
  tagline: Plan · Research · Write · Judge
  port: ${PORT:-8080}
  public_dir: public

# Quality goal the manager must satisfy before the graph exits.
# Criteria are written from the reader's point of view and enforced strictly
# (YAML thresholds + heuristic caps in src/judge.ts).
goal:
  name: publishable_article
  max_iterations: 6
  # Manager must return route "done" AND every criterion score >= threshold
  require_all_criteria: true
  criteria:
    - id: correctness
      label: Correctness
      description: >
        From the reader's seat: can I trust this? No invented facts, fake
        citations, or hand-wavy claims. Every concrete claim should be backed
        by the research notes or clearly marked as opinion/uncertainty.
        Deduct heavily for confidence without evidence.
      weight: 1.2
      threshold: 0.85
    - id: clarity
      label: Clarity
      description: >
        A busy reader can skim headings and still get the point. Short
        paragraphs, unambiguous words, one idea per section. Fail if the
        piece feels dense, vague, or requires re-reading to understand.
      weight: 1.0
      threshold: 0.85
    - id: helpfulness
      label: Helpfulness
      description: >
        The reader leaves with something they can use today — a playbook,
        checklist, decision rule, or worked example that matches the brief.
        Fail if the piece is generic advice without a concrete next step.
      weight: 1.0
      threshold: 0.85
    - id: code_output
      label: Code · Output · Explanation
      description: >
        For technical or how-to briefs (and whenever code would help): include
        (1) a real fenced code block, (2) the expected or sample output/
        result shown nearby, and (3) a plain-language explanation of what
        the code does and why the output looks that way. All three must
        appear together. Score near zero if any leg is missing.
      weight: 1.2
      threshold: 0.85
    - id: visual_feedback
      label: Visual feedback
      description: >
        The reader gets visual confirmation of the system or story: at least
        one draw.io (```drawio mxfile) workflow/architecture diagram AND at
        least one image brief/markdown image with alt text. Diagrams must
        explain a process (not decoration). Fail if either is missing or
        disconnected from the prose.
      weight: 1.1
      threshold: 0.85
    - id: addictive
      label: Addictive
      description: >
        The piece creates a pull to keep reading and try the idea: a strong
        hook, open loops that pay off, progressive reveals, direct "you"
        address, and a memorable close or challenge. Fail if it reads flat,
        academic-only, or easy to abandon mid-scroll.
      weight: 1.0
      threshold: 0.8

# Agent roster — instructions, models, and output keys are fully YAML-driven.
agents:
  planner:
    name: Planner
    description: Breaks the brief into an outline and research questions
    model:
      id: ${CURSOR_MODEL:-composer-2.5}
    mode: plan
    output_key: plan
    instruction: |
      You are the Planner in a multi-agent writing pipeline.

      Brief:
      {{brief}}

      Audience: {{audience}}
      Tone: {{tone}}
      Format: {{format}}
      Target length: {{length}}

      Produce a concise writing plan with:
      1. Working title options (2–3) — lead with a hook title
      2. Audience insight (1 short paragraph) — what they fear / want
      3. Outline with H2/H3 sections and where curiosity pays off
      4. Research questions that must be answered
      5. Success criteria for the final article (user-perspective)
      6. Code · output · explanation beats — which snippets and sample
         results the Writer must show
      7. Visual feedback — required draw.io diagrams + image briefs
         (name, purpose, placement)
      8. Addictive devices — hook, open loops, challenge/close

      Output markdown only. No preamble.

  researcher:
    name: Researcher
    description: Gathers facts, angles, and citations for the plan
    model:
      id: ${CURSOR_MODEL:-composer-2.5}
    mode: agent
    output_key: research
    instruction: |
      You are the Researcher in a multi-agent writing pipeline.

      Brief:
      {{brief}}

      Writing plan:
      {{plan}}

      Gather research notes that answer the plan's research questions.
      Prefer durable knowledge and clearly mark uncertainty.
      Structure your output as markdown with:
      - Key findings (bullets)
      - Evidence / rationale per finding
      - Open questions / unknowns
      - Suggested citations or source types (do not invent URLs)
      - Image research notes (what to depict, style hints)
      - Diagram specs for draw.io: node labels, edge labels, and the story
        each workflow/architecture graph should tell
      - Code · output pairs worth demonstrating (language, snippet intent,
        what the reader should see when it runs)

      Output markdown only. No preamble.

  writer:
    name: Writer
    description: Drafts or revises the article from plan + research + feedback
    model:
      id: ${CURSOR_MODEL:-composer-2.5}
    mode: agent
    output_key: draft
    instruction: |
      You are the Writer in a multi-agent writing pipeline.

      Brief:
      {{brief}}

      Audience: {{audience}}
      Tone: {{tone}}
      Format: {{format}}
      Target length: {{length}}

      Plan:
      {{plan}}

      Research:
      {{research}}

      {% if feedback %}
      Manager feedback to address (mandatory):
      {{feedback}}
      {% endif %}

      {% if draft %}
      Previous draft to revise:
      {{draft}}
      {% endif %}

      Write a complete article in markdown optimized for a busy reader who
      should feel pulled to keep reading and then try something.

      Requirements:
      - Follow the plan structure unless feedback says otherwise
      - Ground claims in the research notes; do not invent facts
      - Open with a hook (tension, question, or surprising claim)
      - Include at least one image using markdown image syntax with descriptive
        alt text, e.g. ![alt](image-brief:short-slug "placement note")
      - Include at least one draw.io diagram as a fenced ```drawio block with
        valid <mxfile>…</mxfile> XML explaining a workflow/architecture
      - Include at least one fenced code block (real language, not drawio) PLUS
        a nearby sample/expected output (fenced text/output or labeled Output:)
        PLUS a short explanation of what the code does and why the output
        looks that way
      - Use clear headings and scannable paragraphs
      - Close with a memorable takeaway or challenge that creates urge to act

      Draw.io tips:
      - Root cells id="0" and parent id="1" are required
      - Vertices: style="rounded=1;whiteSpace=wrap;html=1;..." with mxGeometry
      - Edges: edge="1" with source/target pointing at vertex ids
      - Keep 3–8 nodes so the diagram stays readable

      Output the article markdown only. No preamble.

  manager:
    name: Manager
    description: Scores quality criteria and routes revise vs done
    model:
      id: ${CURSOR_MODEL:-composer-2.5}
    mode: agent
    output_key: evaluation
    # Manager must emit structured JSON the orchestrator can parse
    response_format: json
    instruction: |
      You are a STRICT Manager / quality gate judging from the READER's seat.
      Default posture: revise. Only pass when the draft would delight a busy,
      skeptical user — not when it is merely "good enough."

      Brief:
      {{brief}}

      Plan:
      {{plan}}

      Research:
      {{research}}

      Draft:
      {{draft}}

      Quality criteria (score each from 0.0 to 1.0 — be harsh):
      {% for c in criteria %}
      - {{c.id}} ({{c.label}}): {{c.description}}
        Threshold: {{c.threshold}} — scores below this MUST force route=revise
      {% endfor %}

      Iteration: {{iteration}} of {{max_iterations}}

      Respond with ONLY valid JSON matching this schema:
      {
        "scores": {
          "correctness": 0.0,
          "clarity": 0.0,
          "helpfulness": 0.0,
          "code_output": 0.0,
          "visual_feedback": 0.0,
          "addictive": 0.0
        },
        "passed": false,
        "route": "revise" | "done",
        "feedback": "specific actionable revision notes; empty string if done",
        "summary": "one-sentence verdict"
      }

      Strict rules:
      - Set route to "done" ONLY if EVERY criterion score >= its threshold
        AND passed is true. When in doubt, revise.
      - Do NOT inflate scores for effort or length. Score the reader experience.
      - code_output: require code fence + shown output/result + explanation.
        Missing any leg → score <= 0.5.
      - visual_feedback: require ```drawio mxfile AND an image brief. Missing
        either → score <= 0.5. Mermaid alone does not pass.
      - addictive: require hook, payoff loops, and a close that creates urge
        to try/share. Flat or purely academic tone → score <= 0.55.
      - Feedback must name the failing criteria and exact fixes (where to add
        code+output, which diagram, how to sharpen the hook).
      - If this is the final allowed iteration and quality is still below bar,
        still return route "revise"; the orchestrator stops on max iterations.

# Graph flow — deterministic edges + conditional manager routing.
# Inspired by ADK-style workflow graphs: nodes + edges + route maps.
workflow:
  name: writing_pipeline
  entry: plan
  nodes:
    plan:
      agent: planner
      next: research
    research:
      agent: researcher
      next: write
    write:
      agent: writer
      next: manage
    manage:
      agent: manager
      # Conditional routes come from manager JSON "route" field
      routes:
        revise: write
        done: end
      # Count this hop toward goal.max_iterations when route is revise
      counts_as_iteration: true
  # Terminal node id
  end: end
